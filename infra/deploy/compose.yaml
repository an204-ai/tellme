name: tellme

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4.12-alpine3.21
    restart: unless-stopped
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Coolify}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'appendonly yes\nmaxmemory %s\nmaxmemory-policy noeviction\nrequirepass %s\n' \
          "$$REDIS_MAXMEMORY" "$$REDIS_PASSWORD" > /tmp/tellme-redis.conf
        exec redis-server /tmp/tellme-redis.conf
    tmpfs:
      - /tmp
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging

  api:
    image: tellme-api:production
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment: &tellme-api-environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to the current MongoDB Atlas URI in Coolify}
      MONGODB_DB: ${MONGODB_DB:-tellme}
      REDIS_URL: "redis://default:${REDIS_PASSWORD:?Set REDIS_PASSWORD in Coolify}@redis:6379"
      CLOUDINARY_URL: ${CLOUDINARY_URL:?Set CLOUDINARY_URL in Coolify}
      GIPHY_API_KEY: ${GIPHY_API_KEY:?Set GIPHY_API_KEY in Coolify}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      EPIDEMIC_SOUND_API_KEY: ${EPIDEMIC_SOUND_API_KEY:-}
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:?Set AUTH_CODE_SECRET in Coolify}
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL in Coolify}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in Coolify}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@tellme.my}
      APP_URL: ${APP_URL:-https://tellme.my}
      WEB_ORIGINS: ${WEB_ORIGINS:-https://tellme.my,https://admin.tellme.my}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-https://admin.tellme.my}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS to verified real administrator emails in Coolify}
      MEDIA_ORPHAN_HOURS: ${MEDIA_ORPHAN_HOURS:-24}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    logging: *default-logging

  worker-media:
    image: tellme-worker-media:production
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        WORKER: "@tellme/worker-media"
    restart: unless-stopped
    environment: *tellme-api-environment
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-feed:
    image: tellme-worker-feed:production
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        WORKER: "@tellme/worker-feed"
    restart: unless-stopped
    environment: *tellme-api-environment
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-notification:
    image: tellme-worker-notification:production
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        WORKER: "@tellme/worker-notification"
    restart: unless-stopped
    environment: *tellme-api-environment
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  web-app:
    image: tellme-web:production
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      NEXT_DIST_DIR: .next-production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    logging: *default-logging

  web-edge:
    image: tellme-web-edge:production
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web-edge
    restart: unless-stopped
    depends_on:
      web-app:
        condition: service_healthy
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  landing:
    image: tellme-landing:production
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.landing
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://about.tellme.my}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  admin-edge:
    image: tellme-admin:production
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

volumes:
  redis_data:
